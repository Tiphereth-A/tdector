# Based on https://github.com/typst/typst/blob/main/.github/workflows/release.yml and https://github.com/typstyle-rs/typstyle/blob/master/.github/workflows/build-binaries.yml

name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - '.github/**'
      - 'tdector-app/**'
      - 'tdector-cli/**'
      - 'tdector-core/**'
      - 'tdector-eval/**'
      - 'tdector-file/**'
      - 'tdector-gui/**'
      - 'tdector-io/**'
      - 'tdector-mcp/**'
      - 'tdector-text/**'
      - 'tdector-wasm/**'
      - '*.toml'
      - 'Cargo.lock'
  pull_request:
    branches:
      - master
    paths:
      - '.github/**'
      - 'tdector-app/**'
      - 'tdector-cli/**'
      - 'tdector-core/**'
      - 'tdector-eval/**'
      - 'tdector-file/**'
      - 'tdector-gui/**'
      - 'tdector-io/**'
      - 'tdector-mcp/**'
      - 'tdector-text/**'
      - 'tdector-wasm/**'
      - '*.toml'
      - 'Cargo.lock'
  workflow_dispatch:


env:
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc

jobs:
  headless:
    name: Headless API, CLI, MCP tests and dependency boundaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify headless dependency boundary
        run: |
          python3 - <<'PY'
          import subprocess
          def check(packages, forbidden):
              arguments = ["cargo", "tree", "--locked", "--target", "all",
                           "--edges", "normal,build", "--prefix", "none", "--format", "{p}"]
              for package in packages:
                  arguments.extend(["-p", package])
              tree = subprocess.check_output(arguments, text=True)
              leaked = sorted({line.split()[0] for line in tree.splitlines() if line.strip()} & forbidden)
              if leaked:
                  raise SystemExit(f"Forbidden dependencies in {packages}: {leaked}")

          check(["tdector-app", "tdector-cli", "tdector-io", "tdector-mcp"], {"egui", "eframe", "rfd"})
          check(["tdector-app", "tdector-wasm"], {"rmcp", "tdector-io"})
          check(["tdector-cli", "tdector-gui"], {"rmcp"})
          PY
      - name: Test native adapters, shared application, and libraries
        run: cargo test --locked -p tdector-cli -p tdector-io -p tdector-mcp -p tdector-app -p tdector-core -p tdector-eval -p tdector-file -p tdector-text

  build:
    name: build (${{ matrix.target }}-${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [release, test]
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32
            arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            platform: win32
            arch: arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux
            arch: x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux
            arch: arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin
            arch: x64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin
            arch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install llvm
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install llvm
      - name: Install AArch64 target toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install gcc-aarch64-linux-gnu
      - name: Install ARM target toolchain
        if: matrix.target == 'arm-unknown-linux-gnueabihf'
        run: |
          sudo apt-get update
          sudo apt-get install gcc-arm-linux-gnueabihf

      - name: Run tests
        if: matrix.profile == 'test' && (matrix.platform == 'darwin' || matrix.arch != 'arm64')
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build desktop, CLI, and MCP binaries
        if: matrix.profile != 'test'
        shell: pwsh
        run: |
          cargo build --locked -p tdector-gui -p tdector-cli -p tdector-mcp --profile ${{ matrix.profile }} --target ${{ matrix.target }}

      - name: Copy binaries to output directory
        if: matrix.profile != 'test'
        shell: pwsh
        run: |
          cp "target/${{ matrix.target }}/release/tdector-gui${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}" "tdector-gui-${{ matrix.target }}${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}"
          cp "target/${{ matrix.target }}/release/tdector${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}" "tdector-${{ matrix.target }}${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}"
          cp "target/${{ matrix.target }}/release/tdector-mcp${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}" "tdector-mcp-${{ matrix.target }}${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}"

      - uses: actions/upload-artifact@v7
        if: matrix.profile != 'test'
        with:
          name: tdector-gui-${{ matrix.target }}-${{ matrix.profile }}
          path: tdector-gui-${{ matrix.target }}${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}

      - uses: actions/upload-artifact@v7
        if: matrix.profile != 'test'
        with:
          name: tdector-${{ matrix.target }}-${{ matrix.profile }}
          path: tdector-${{ matrix.target }}${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}

      - uses: actions/upload-artifact@v7
        if: matrix.profile != 'test'
        with:
          name: tdector-mcp-${{ matrix.target }}-${{ matrix.profile }}
          path: tdector-mcp-${{ matrix.target }}${{ fromJSON('["", ".exe"]')[matrix.platform == 'win32'] }}

  build_alpine:
    name: build (x86_64-unknown-linux-musl-${{ matrix.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:alpine
      volumes:
        - /usr/local/cargo/registry:/usr/local/cargo/registry
    env:
      RUST_TARGET: x86_64-unknown-linux-musl
      RUSTFLAGS: "-C target-feature=+crt-static"
    strategy:
      fail-fast: false
      matrix:
        profile: [release, test]
    steps:
      - name: Install dependencies
        run: apk add --no-cache git clang lld musl-dev nodejs npm yarn binutils github-cli
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run tests
        if: matrix.profile == 'test'
        run: cargo test --locked --target ${{ env.RUST_TARGET }}

      - name: Build desktop, CLI, and MCP binaries
        if: matrix.profile != 'test'
        run: |
          cargo build --locked -p tdector-gui -p tdector-cli -p tdector-mcp --profile ${{ matrix.profile }} --target ${{ env.RUST_TARGET }}

      - name: Copy binaries to output directory
        if: matrix.profile != 'test'
        run: |
          cp "target/${{ env.RUST_TARGET }}/release/tdector-gui" "tdector-gui-${{ env.RUST_TARGET }}"
          cp "target/${{ env.RUST_TARGET }}/release/tdector" "tdector-${{ env.RUST_TARGET }}"
          cp "target/${{ env.RUST_TARGET }}/release/tdector-mcp" "tdector-mcp-${{ env.RUST_TARGET }}"

      - uses: actions/upload-artifact@v7
        if: matrix.profile != 'test'
        with:
          name: tdector-gui-${{ env.RUST_TARGET }}-${{ matrix.profile }}
          path: tdector-gui-${{ env.RUST_TARGET }}

      - uses: actions/upload-artifact@v7
        if: matrix.profile != 'test'
        with:
          name: tdector-${{ env.RUST_TARGET }}-${{ matrix.profile }}
          path: tdector-${{ env.RUST_TARGET }}

      - uses: actions/upload-artifact@v7
        if: matrix.profile != 'test'
        with:
          name: tdector-mcp-${{ env.RUST_TARGET }}-${{ matrix.profile }}
          path: tdector-mcp-${{ env.RUST_TARGET }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [headless, build, build_alpine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          current_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          # Follow the release branch and skip the current tag's commit.
          previous_tag="$(git describe --tags --abbrev=0 --first-parent --match 'v*' "${current_commit}^" 2>/dev/null || true)"
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          if [[ -n "$previous_tag" ]]; then
            range="${previous_tag}..${current_commit}"
            printf '## Changes since %s\n\n' "$previous_tag" > release-notes.md
          else
            range="$current_commit"
            printf '## Changes\n\n' > release-notes.md
          fi

          git log --reverse --format="- %s ([%h](${repository_url}/commit/%H))" "$range" -- >> release-notes.md

          if [[ -n "$previous_tag" ]]; then
            printf '\n[Full changelog](%s/compare/%s...%s)\n' \
              "$repository_url" "$previous_tag" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file release-notes.md \
            artifacts/*
