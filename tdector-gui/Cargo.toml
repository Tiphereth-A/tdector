[package]
name = "tdector-gui"
version = "0.1.8"
edition = "2024"

[dependencies]
tdector-core = { path = "../tdector-core" }
tdector-eval = { path = "../tdector-eval" }
tdector-file = { path = "../tdector-file" }
tdector-text = { path = "../tdector-text" }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
image = "0.25"

[lints]
workspace = true
