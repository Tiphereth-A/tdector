[package]
name = "tdector-gui"
version = "0.1.8"
edition = "2024"

[dependencies]
tdector-core = { path = "../tdector-core" }
egui = "0.36"
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rfd = "0.17"
pollster = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
image = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom-v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom-v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom-v02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "*", features = ["js"] }
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "File",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
] }

[lints]
workspace = true
