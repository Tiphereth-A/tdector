[package]
name = "tdector-gui"
version = "0.3.0"
edition = "2024"

[dependencies]
tdector-app = { path = "../tdector-app" }
tdector-core = { path = "../tdector-core" }
tdector-eval = { path = "../tdector-eval" }
rfd = "0.17"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["ico"] }
pollster = "1.0"

[lints]
workspace = true
