[package]
name = "tdector-wasm"
version = "0.1.8"
edition = "2024"

[dependencies]
tdector-core = { path = "../tdector-core" }
tdector-gui = { path = "../tdector-gui" }
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
log = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom-v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom-v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom-v02 = { package = "getrandom", version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "Event",
    "EventTarget",
] }

[lints]
workspace = true
