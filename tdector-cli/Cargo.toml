[package]
name = "tdector-cli"
version = "0.3.1"
edition = "2024"
description = "Headless project queries, editing, and exports for tdector"

[[bin]]
name = "tdector"
path = "src/main.rs"

[features]
default = []
gui-control = [
    "dep:tdector-gui",
    "tdector-gui/gui-control",
    "dep:shlex",
    "dep:windows-sys",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tdector-gui = { path = "../tdector-gui", optional = true }
shlex = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"], optional = true }

[dependencies]
tdector-app = { path = "../tdector-app" }
tdector-eval = { path = "../tdector-eval" }
tdector-io = { path = "../tdector-io" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
