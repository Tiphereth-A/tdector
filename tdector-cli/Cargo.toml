[package]
name = "tdector-cli"
version = "0.2.0"
edition = "2024"
description = "Headless project queries, editing, and exports for tdector"

[[bin]]
name = "tdector"
path = "src/main.rs"

[dependencies]
tdector-app = { path = "../tdector-app" }
tdector-eval = { path = "../tdector-eval" }
tdector-io = { path = "../tdector-io" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
